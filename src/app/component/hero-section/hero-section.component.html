<section class="hero-section" id="hero">
  <div class="container">
    <div class="row align-items-center min-vh-100 gy-5">
      <div class="col-lg-6 col-md-12 hero-content">
        <div class="hero-text-wrapper" appReveal>
          <div class="greeting-badge">
            <span class="wave" aria-hidden="true">👋</span>
            <span>Hello, I'm</span>
          </div>

          <h1 class="hero-title">{{ profile.name }}</h1>

          <div class="hero-subtitle">
            <span class="subtitle-text">I'm into</span>
            <div class="typewriter-container">
              <span class="typewriter">{{ displayText }}</span>
            </div>
          </div>

          <p class="hero-description">{{ profile.tagline }}</p>

          <div class="hero-actions">
            <a [href]="profile.resumePath" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-lg"
              appMagnetic>
              View resume
            </a>
            <a routerLink="/" fragment="contact" class="btn btn-secondary btn-lg" appMagnetic>
              Let's talk
            </a>
            <a [href]="profile.resumePath" download class="btn btn-secondary btn-lg">
              Download
            </a>
          </div>

          <div class="hero-social">
            <a *ngFor="let link of socials" [href]="link.href" class="social-link" [attr.title]="link.label"
              [attr.aria-label]="link.label" target="_blank" rel="noopener noreferrer">
              <i *ngIf="link.icon === 'email'" class="fa-solid fa-envelope"></i>
              <i *ngIf="link.icon === 'phone'" class="fa-solid fa-phone"></i>
              <i *ngIf="link.icon === 'github'" class="fab fa-github"></i>
              <i *ngIf="link.icon === 'linkedin'" class="fab fa-linkedin-in"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="col-lg-6 col-md-12 hero-image-wrapper" appReveal>
        <div class="hero-image-container">
          <div class="image-frame">
            <img [src]="profile.photo" [alt]="profile.name + ' — Full Stack Developer'" class="hero-image">
          </div>
        </div>
      </div>
    </div>
  </div>

  <a class="scroll-indicator" routerLink="/" fragment="about" aria-label="Scroll to about">
    <span>Scroll</span>
    <div class="mouse">
      <div class="wheel"></div>
    </div>
  </a>
</section>
