<section id="projects" class="projects-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header" appReveal>
      <div class="section-badge">
        <span class="badge-num">03</span> PROJECTS
      </div>
      <h2 class="section-title">Featured Projects</h2>
      <p class="section-subtitle">A showcase of web applications I have built.</p>
    </div>

    <!-- Case Studies Showcase Container -->
    <div class="case-studies-wrapper">
      <article
        *ngFor="let item of projects; let i = index; let isOdd = odd"
        class="case-study-card"
        [class.reverse-layout]="isOdd"
        appReveal
      >
        <!-- Left/Right: Editorial Content -->
        <div class="case-info">
          <div class="case-meta">
            <span class="case-index">0{{ i + 1 }} // PROJECT</span>
          </div>

          <h3 class="case-title">{{ item.title }}</h3>
          <p class="case-description">{{ item.description }}</p>

          <!-- Technology Pills -->
          <div class="case-tags-row">
            <span *ngFor="let tag of item.tags" class="tech-tag">
              {{ tag }}
            </span>
          </div>

          <!-- Action Buttons & Links -->
          <div class="case-actions">
            <button *ngIf="item.demoNote" (click)="showDemoContactAlert()" class="btn-2026 btn-primary-2026">
              <i class="fa-solid fa-envelope"></i> Request Demo
            </button>

            <a
              *ngFor="let link of item.links"
              [href]="link.href"
              target="_blank"
              class="btn-2026 btn-secondary-2026"
            >
              <span>{{ link.label }}</span>
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
          </div>
        </div>

        <!-- Right/Left: Visual Browser Window Preview Frame -->
        <div class="case-visual">
          <div class="browser-window">
            <div class="browser-bar">
              <div class="browser-dots">
                <span class="b-dot b-close"></span>
                <span class="b-dot b-min"></span>
                <span class="b-dot b-max"></span>
              </div>
              <div class="browser-address-bar">
                <i class="fa-solid fa-globe"></i> {{ item.title }}
              </div>
            </div>

            <!-- Custom Mockup View Area per project -->
            <div class="browser-body">
              <div class="mockup-ui">
                <div class="ui-topbar">
                  <span class="ui-title">{{ item.title }}</span>
                  <span class="ui-badge">Angular</span>
                </div>
                <div class="ui-hero-preview">
                  <span class="ui-headline">{{ item.title }} Showcase</span>
                  <div class="ui-pills">
                    <span *ngFor="let tag of item.tags" class="mini-tag">{{ tag }}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
