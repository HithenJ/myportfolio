<section class="projects-section" id="projects">
  <div class="container">
    <div class="section-header" appReveal>
      <span class="section-kicker">Work</span>
      <h2 class="section-title">Selected projects</h2>
      <p class="section-subtitle">Things I've shipped — more screenshots coming soon</p>
    </div>

    <div class="project-list">
      <article class="project-card" *ngFor="let project of projects; let i = index" appReveal>
        <div class="project-meta">
          <span class="project-index">{{ indexLabel(i) }}</span>
          <div class="project-visual" *ngIf="project.image; else placeholder">
            <img [src]="project.image" [alt]="project.title">
          </div>
          <ng-template #placeholder>
            <div class="project-visual placeholder">
              <span>{{ project.title }}</span>
            </div>
          </ng-template>
        </div>
        <div class="project-body">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-description">{{ project.description }}</p>
          <div class="project-tags">
            <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
          </div>
          <div class="project-footer">
            <a *ngIf="project.demoNote" routerLink="/" fragment="contact" class="btn btn-secondary">Request a demo</a>
            <a *ngFor="let link of project.links" [href]="link.href" class="project-link"
              [attr.target]="link.external ? '_blank' : null" rel="noopener noreferrer">{{ link.label }}</a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
