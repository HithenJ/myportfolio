<section class="skills-section" id="skills">
  <div class="container">
    <div class="section-header" appReveal>
      <span class="section-kicker">Skills</span>
      <h2 class="section-title">Tools I reach for</h2>
      <p class="section-subtitle">A mix of frontend, backend, and the boring-but-important bits</p>
    </div>
  </div>

  <div class="marquee" appReveal>
    <div class="marquee-track">
      <span class="marquee-item" *ngFor="let skill of marquee">{{ skill.name }}</span>
    </div>
    <div class="marquee-track reverse">
      <span class="marquee-item" *ngFor="let skill of marquee">{{ skill.name }}</span>
    </div>
  </div>

  <div class="container">
    <div class="skill-grid" appReveal>
      <div class="skill-card" *ngFor="let skill of skills">
        <div class="skill-icon" [style.background]="skill.accent">
          <i [class]="skill.iconClass"></i>
        </div>
        <h5 class="skill-name">{{ skill.name }}</h5>
      </div>
    </div>
  </div>
</section>
