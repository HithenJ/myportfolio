<section id="skills" class="skills-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header" appReveal>
      <div class="section-badge">
        <span class="badge-num">02</span> SKILLS & TECHNOLOGIES
      </div>
      <h2 class="section-title">Technical Skills</h2>
      <p class="section-subtitle">Technologies, frameworks, and AI tools I work with to build modern web applications.</p>
    </div>

    <!-- Category Filter Bar -->
    <div class="category-filters" appReveal>
      <button
        *ngFor="let cat of categories"
        class="cat-filter-btn"
        [class.active]="activeCategory === cat.id"
        (click)="setCategory(cat.id)"
      >
        <span>{{ cat.label }}</span>
      </button>
    </div>

    <!-- Filtered Skill Cards Grid -->
    <div class="skills-grid" appReveal>
      <div *ngFor="let skill of filteredSkills" class="skill-card card-2026">
        <div class="skill-top">
          <div class="skill-icon-wrapper" [style.color]="skill.accent">
            <span *ngIf="skill.svg" [innerHTML]="getSafeSvg(skill.svg)" class="svg-icon-span"></span>
            <i *ngIf="!skill.svg && skill.iconClass" [class]="skill.iconClass"></i>
          </div>
          <span *ngIf="skill.category" class="skill-level-badge">{{ skill.category }}</span>
        </div>

        <h3 class="skill-name">{{ skill.name }}</h3>
      </div>
    </div>
  </div>
</section>
