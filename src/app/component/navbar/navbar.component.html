<nav class="navbar navbar-expand-lg fixed-top modern-navbar" [class.scrolled]="isScrolled">
  <div class="container">
    <a class="navbar-brand" routerLink="/" fragment="hero" (click)="closeMenu()">
      <span class="brand-icon">{{ profile.initials }}</span>
      <span class="brand-text">{{ profile.name }}</span>
    </a>

    <button class="navbar-toggler" type="button" (click)="toggleMenu()" [attr.aria-expanded]="!isMenuCollapsed"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse" [ngClass]="{'collapse': isMenuCollapsed}">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item" *ngFor="let link of links">
          <a class="nav-link" routerLink="/" [fragment]="link.id" [class.active]="activeSection === link.id"
            (click)="closeMenu()">{{ link.label }}</a>
        </li>
        <li class="nav-item nav-cta">
          <span class="available-pill" *ngIf="profile.available">Available</span>
          <a class="btn btn-primary nav-hire" routerLink="/" fragment="contact" appMagnetic (click)="closeMenu()">Hire me</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
