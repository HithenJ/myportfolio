<section class="contact-section" id="contact">
  <div class="container">
    <div class="row g-4 align-items-start">
      <div class="col-lg-5" appReveal>
        <span class="section-kicker">Contact</span>
        <h2 class="section-title">Let's build something</h2>
        <p class="lede">
          Open to roles, freelance, and interesting side quests. Drop a note — I usually reply within a day.
        </p>
        <div class="contact-actions">
          <button type="button" class="copy-btn" (click)="copy('email')">
            <span>{{ profile.email }}</span>
            <small>{{ copied === 'email' ? 'Copied' : 'Copy email' }}</small>
          </button>
          <button type="button" class="copy-btn" (click)="copy('phone')">
            <span>{{ profile.phoneDisplay }}</span>
            <small>{{ copied === 'phone' ? 'Copied' : 'Copy phone' }}</small>
          </button>
        </div>
      </div>

      <div class="col-lg-7" appReveal>
        <div class="contact-card">
          <div *ngIf="submitted" class="alert alert-success">
            Thanks — I'll get back to you soon.
          </div>
          <div *ngIf="error" class="alert alert-error">{{ error }}</div>

          <form (submit)="onSubmit($event)" class="contact-form">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_subject" value="New message from portfolio contact form">

            <div class="form-group">
              <label class="form-label" for="contact-name">Name</label>
              <input id="contact-name" type="text" name="name" class="form-control" placeholder="Your name" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="contact-email">Email</label>
              <input id="contact-email" type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="contact-message">Message</label>
              <textarea id="contact-message" rows="5" name="message" class="form-control" placeholder="What should we make?"
                required></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100" appMagnetic [disabled]="sending">
              <span *ngIf="!sending">Send message</span>
              <span *ngIf="sending">Sending…</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
