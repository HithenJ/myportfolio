<section class="notfound-section">
  <div class="container">
    <div class="notfound-content">
      <div class="error-number">
        <span class="digit">4</span>
        <span class="digit zero">0</span>
        <span class="digit">4</span>
      </div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-description">
        This URL wandered off. Head home, or jump to a section.
      </p>
      <div class="error-actions">
        <a routerLink="/" fragment="hero" class="btn btn-primary btn-lg">Go home</a>
        <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Go back</a>
      </div>
      <div class="helpful-links">
        <p class="links-title">Or skip ahead</p>
        <div class="quick-links">
          <a routerLink="/" fragment="about" class="quick-link">About</a>
          <a routerLink="/" fragment="skills" class="quick-link">Skills</a>
          <a routerLink="/" fragment="projects" class="quick-link">Projects</a>
          <a routerLink="/" fragment="contact" class="quick-link">Contact</a>
        </div>
      </div>
    </div>
  </div>
</section>
